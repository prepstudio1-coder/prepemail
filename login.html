<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  
  <link rel="icon" href="/assets/logo.png" type="image/png">
<title>Login | PREP</title>
  <link rel="stylesheet" href="auth.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

  <link rel='stylesheet' href='mobile-fixes.css'>

<body>
  <script>
    if (localStorage.getItem("darkMode") === "on") document.body.classList.add("dark");
  </script>

  <div class="container">
    <h1 class="logo">PREP</h1>

    <form id="loginForm" class="form-box">
      <input type="email" id="email" placeholder="Email" required />
      
      <div class="input-group">
        <input type="password" id="password" placeholder="Password" required />
        <span class="toggle-password"><i class="fas fa-eye"></i></span>
      </div>

      <button type="submit" id="loginBtn" class="btn btn--primary">Login</button>

      <div class="auth-divider">
        <span>or</span>
      </div>

      <button type="button" id="googleLoginBtn" class="btn btn--google">
        <svg class="google-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Continue with Google
      </button>

      <p class="link-text">
        <a href="#" id="forgotPasswordLink">Forgot Password?</a>
      </p>
      <p class="link-text">
        Don't have an account?
        <a href="signup.html" class="signup-link">Create Account</a>
      </p>

      <p id="loginMessage" class="message"></p>
    </form>

    <div id="forgotPasswordSection">
      <h3 style="margin-bottom:15px; font-size:1.1rem;">Reset Password</h3>
      <form id="forgotPasswordForm">
        <input type="email" id="forgotEmail" placeholder="Enter your email" required />
        <button type="submit" id="sendResetBtn" class="btn btn--primary" style="margin-top:10px;">Send Link</button>
        <p id="forgotMessage" class="message"></p>
      </form>
    </div>
  </div>

  <script type="module" src="login.js"></script>
</body>
</html>
