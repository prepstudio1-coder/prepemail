<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Payment Successful - PREP</title>
  <link rel="icon" href="/assets/logo.png" type="image/png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: radial-gradient(circle at top, #f7f3ff 0%, #f0ebff 46%, #e7e0ff 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .success-container {
      background: white;
      border-radius: 28px;
      box-shadow: 0 24px 80px rgba(90, 24, 154, 0.12);
      padding: 60px 40px;
      max-width: 500px;
      text-align: center;
    }

    .success-icon {
      font-size: 4rem;
      color: #4CAF50;
      margin-bottom: 20px;
      animation: scaleIn 0.6s ease-out;
    }

    @keyframes scaleIn {
      from {
        transform: scale(0);
        opacity: 0;
      }
      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    h1 {
      color: #2f0e4f;
      font-size: 2rem;
      margin-bottom: 15px;
    }

    .subtitle {
      color: #6f6578;
      font-size: 1.1rem;
      line-height: 1.8;
      margin-bottom: 30px;
    }

    .features {
      background: rgba(245, 237, 255, 0.5);
      border-radius: 16px;
      padding: 25px;
      margin-bottom: 30px;
      text-align: left;
    }

    .feature-item {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      color: #4d4558;
      font-size: 0.95rem;
    }

    .feature-item:last-child {
      margin-bottom: 0;
    }

    .feature-item i {
      color: #ff6500;
      min-width: 20px;
      font-size: 1.2rem;
    }

    .button-group {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }

    .btn {
      flex: 1;
      min-width: 150px;
      padding: 15px 20px;
      border-radius: 12px;
      border: none;
      font-weight: 700;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.3s ease;
      text-decoration: none;
      display: inline-block;
    }

    .btn-primary {
      background: #ff6500;
      color: white;
    }

    .btn-primary:hover {
      background: #e55a00;
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(255, 101, 0, 0.3);
    }

    .btn-secondary {
      background: rgba(90, 24, 154, 0.1);
      color: #5a189a;
    }

    .btn-secondary:hover {
      background: rgba(90, 24, 154, 0.2);
      transform: translateY(-2px);
    }

    .loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255, 101, 0, 0.3);
      border-radius: 50%;
      border-top-color: #ff6500;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
  <link rel='stylesheet' href='mobile-fixes.css'>

<body>
  <div class="success-container">
    <div class="success-icon" id="statusIcon">
      <i class="fas fa-check-circle"></i>
    </div>

    <h1 id="statusTitle">Payment Successful!</h1>
    
    <p class="subtitle" id="statusMessage">
      Your PREP Pro subscription is now active. You have full access to unlimited projects, advanced AI features, and priority support.
    </p>

    <div class="features">
      <div class="feature-item">
        <i class="fas fa-infinity"></i>
        <span>Unlimited active projects</span>
      </div>
      <div class="feature-item">
        <i class="fas fa-brain"></i>
        <span>Advanced AI scene analysis</span>
      </div>
      <div class="feature-item">
        <i class="fas fa-database"></i>
        <span>500MB+ storage</span>
      </div>
      <div class="feature-item">
        <i class="fas fa-headset"></i>
        <span>Priority support</span>
      </div>
    </div>

    <div class="button-group">
      <a href="dashboard.html" class="btn btn-primary">
        <i class="fas fa-arrow-right"></i> Go to Dashboard
      </a>
      <a href="more.html" class="btn btn-secondary">
        <i class="fas fa-home"></i> Home
      </a>
    </div>
  </div>

  <script type="module">
    import { auth, db } from './firebase.js';
    import { onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.12.3/firebase-auth.js';
    import { doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.12.3/firebase-firestore.js';

    const urlParams = new URLSearchParams(window.location.search);
    const reference = urlParams.get('reference');

    // Show loading state
    if (!reference) {
      document.getElementById('statusIcon').innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
      document.getElementById('statusTitle').textContent = 'Processing Payment...';
      document.getElementById('statusMessage').textContent = 'Please wait while we verify your payment.';
    }

    // Verify auth and process payment
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        // User not authenticated, redirect to login
        setTimeout(() => {
          window.location.href = 'login.html';
        }, 2000);
        return;
      }

      if (!reference) {
        // No payment reference, show error
        document.getElementById('statusIcon').innerHTML = '<i class="fas fa-exclamation-circle"></i>';
        document.getElementById('statusTitle').textContent = 'Payment Status Unknown';
        document.getElementById('statusMessage').textContent = 'Unable to verify payment. Please contact support.';
        return;
      }

      try {
        // Verify payment with backend — send the Firebase ID token so the server
        // can confirm who the caller is without trusting the client-supplied userId.
        const idToken = await user.getIdToken();
        const verifyResponse = await fetch('https://prepemail.onrender.com/api/payment/verify', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${idToken}`,
          },
          body: JSON.stringify({
            reference   // Paystack reference string from ?reference= query param
            // userId intentionally removed — server reads it from the verified token
          })
        });

        const verifyData = await verifyResponse.json();

        if (!verifyData.success) {
          // Payment verification failed
          document.getElementById('statusIcon').innerHTML = '<i class="fas fa-times-circle"></i>';
          document.getElementById('statusTitle').textContent = 'Payment Verification Failed';
          document.getElementById('statusMessage').textContent = 'We could not verify your payment. Please try again or contact support.';
          return;
        }

        // The server already updated Firestore inside /api/payment/verify.
        // We only need to sync the plan into localStorage for cross-tab awareness.
        const plan = verifyData.plan || 'pro';
        const userRef = doc(db, 'users', user.uid);

        // Fetch the latest user data (already written by the server) for localStorage sync
        const userDoc = await getDoc(userRef);
        const currentData = userDoc.data() || {};

        // Broadcast plan change to other tabs for real-time sync
        const updatedProfile = { ...currentData, plan: plan };
        localStorage.setItem('prep_user_profile', JSON.stringify(updatedProfile));
        localStorage.setItem('prep_plan_updated_at', new Date().getTime().toString());
        
        // Dispatch storage event to notify other tabs (this is for cross-tab sync)
        window.dispatchEvent(new StorageEvent('storage', {
          key: 'prep_user_profile',
          newValue: JSON.stringify(updatedProfile),
          oldValue: JSON.stringify(currentData),
          storageArea: localStorage
        }));

        // Update UI to show success
        document.getElementById('statusIcon').innerHTML = '<i class="fas fa-check-circle"></i>';
        document.getElementById('statusTitle').textContent = 'Welcome to PREP Pro! 🎉';
        document.getElementById('statusMessage').textContent = 'Your subscription is now active. All Pro features are ready to use!';

        // Update the features display based on plan
        const featuresContainer = document.querySelector('.features');
        if (plan === 'pro') {
          featuresContainer.innerHTML = `
            <div class="feature-item">
              <i class="fas fa-infinity"></i>
              <span>Unlimited active projects</span>
            </div>
            <div class="feature-item">
              <i class="fas fa-brain"></i>
              <span>Advanced AI scene analysis</span>
            </div>
            <div class="feature-item">
              <i class="fas fa-database"></i>
              <span>500MB+ storage</span>
            </div>
            <div class="feature-item">
              <i class="fas fa-headset"></i>
              <span>Priority support</span>
            </div>
          `;
        } else if (plan === 'studio') {
          featuresContainer.innerHTML = `
            <div class="feature-item">
              <i class="fas fa-star"></i>
              <span>Everything in Pro +</span>
            </div>
            <div class="feature-item">
              <i class="fas fa-cog"></i>
              <span>Custom workflows</span>
            </div>
            <div class="feature-item">
              <i class="fas fa-user-tie"></i>
              <span>Dedicated account manager</span>
            </div>
            <div class="feature-item">
              <i class="fas fa-plug"></i>
              <span>API and SSO access</span>
            </div>
          `;
        }

        // Redirect to dashboard after 3 seconds
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 3000);

      } catch (error) {
        console.error('Payment processing error:', error);
        document.getElementById('statusIcon').innerHTML = '<i class="fas fa-exclamation-circle"></i>';
        document.getElementById('statusTitle').textContent = 'Error Processing Payment';
        document.getElementById('statusMessage').textContent = error.message || 'An error occurred while processing your payment.';
      }
    });
  </script>
</body>
</html>
